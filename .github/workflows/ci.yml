name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter test
      - name: Show files the toolchain changed
        run: flutter --version && git status --short && git diff
      - run: dart pub publish --dry-run
